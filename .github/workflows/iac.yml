name: Infraestructure as a code pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        type: choice
        required: true
        options:
          - "destroy"
          - "create"

jobs:
  deploy-eks:
    
    defaults:
      run:
        working-directory: ./terraform/eks

    runs-on: ubuntu-latest
    if: ${{ inputs.action == 'create' }}  
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Log to aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: run terraform init
        run: terraform init

      - name: run terraform plan
        run: terraform plan

      - name: run terraform apply
        run: terraform apply -auto-approve

  destroy-eks:

    defaults:
      run:
        working-directory: ./terraform/eks

    runs-on: ubuntu-latest
    if: ${{ inputs.action == 'destroy' }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        
      - name: Log to aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - name: setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"
        
      - name: run terraform init
        run: terraform init
      
      - name: Clean up dynamic EKS resources
        run: |
          aws eks update-kubeconfig --region us-east-1 --name demo-cluster-x
          
          echo "deleting Ingresses..."
          kubectl delete ingress --all --all-namespaces || true
          
          echo "deleting LoadBalancers..."
          kubectl get svc --all-namespaces -o json | jq -r '.items[] | select(.spec.type=="LoadBalancer") | "\(.metadata.namespace) \(.metadata.name)"' | while read ns name; do
            if [ ! -z "$name" ]; then
              kubectl delete svc $name -n $ns || true
            fi
          done
          
          echo "deleting PVCs..."
          kubectl delete pvc --all --all-namespaces || true
          
          sleep 90

      - name: run terraform destroy
        run: terraform destroy -auto-approve

      
